workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

decrypt_repository:
  stage: .pre
  image: xueshanf/docker-git-crypt
  script:
    - echo $CI_GIT_CRYPT_KEY | base64 --decode > $CI_PROJECT_DIR/decrypt-key
    - cd $CI_PROJECT_DIR
    - git-crypt unlock decrypt-key

before_script:
  - apt install git-crypt
  - echo $CI_GIT_CRYPT_KEY | base64 --decode > ~/decription-key
  - cd $CI_PROJECT_DIR
  - git-crypt unlock ~/decription-key

build:
  stage: build
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile.prod --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH
  environment: push-to-docker-hub
